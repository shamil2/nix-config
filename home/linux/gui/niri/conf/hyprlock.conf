# Hyprlock configuration with Catppuccin Mocha theme

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

auth {
    # Parallel fingerprint authentication handled directly via fprintd
    fingerprint:enabled = true
    fingerprint:ready_message = (Posez le doigt sur le capteur...)
    fingerprint:present_message = Empreinte en cours de lecture...
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A %d %B %Y")"
    color = rgb(166, 173, 200)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Password Input & Fingerprint
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    rounding = 20
    outer_color = rgb(203, 166, 247)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Mot de passe ou empreinte...</span>
    hide_input = false
    check_color = rgb(249, 226, 175)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -30
    halign = center
    valign = center
}
